title: SafeScribe
description: Fully on-device transcription. Your audio never leaves your device — there is no server and no account.
url: https://safescribeai.github.io
markdown: kramdown

# Uzantısız adresler: en/privacy.md -> /en/privacy/ (varsayılan /en/privacy.html).
# Gezinti bağlantıları ve App Store'a verilen URL'ler zaten uzantısız; varsayılan
# kuralda sayfa kendi canonical'ını .html'li ilan ediyordu, yani aynı sayfanın
# iki adı dolaşımdaydı. 404.html kendi permalink'ini taşıdığı için etkilenmez.
permalink: pretty

plugins:
  - jekyll-sitemap

# Repo-internal files are not site content. Without this they are copied to the
# published site verbatim — CLAUDE.md, README.md, LICENSE and the release
# scripts were all reachable on the published site, and CLAUDE.md was rendered as a
# page and listed in sitemap.xml.
exclude:
  - CLAUDE.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - scripts/
  - ds/
  - .ruby-version
  - .claude/
