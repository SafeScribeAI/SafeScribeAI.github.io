title: SafeScribe
description: Privacy-first AI audio transcription. Your audio is processed in our server's memory only, never written to our disks, and deleted the moment your text is ready.
url: https://safescribe.dev
markdown: kramdown

plugins:
  - jekyll-sitemap

# Repo-internal files are not site content. Without this they are copied to the
# published site verbatim — CLAUDE.md, README.md, LICENSE and the release
# scripts were all reachable on safescribe.dev, and CLAUDE.md was rendered as a
# page and listed in sitemap.xml.
exclude:
  - CLAUDE.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - scripts/
  - ds/
  - .ruby-version
  - .claude/
