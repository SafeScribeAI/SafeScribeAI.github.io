# Canonical numeric/pricing facts for SafeScribe — the SINGLE SOURCE for the marketing site.
#
# WHY: these numbers were hand-copied across 10 locale index.md files, so a change to one
# (e.g. upload limit, price) silently went stale in the others.
#
# WIRED (rendered via Liquid — update HERE only): `packages` — every locale's pricing cards
# read price + data-hours from {{ site.data.facts.packages[i].* }}.
# NOT WIRED (still hand-copied — update all 10 locale index.md files when changing): prose
# numbers (language_count, format counts, upload_max_mb, max_duration_hours, free_hours)
# and the translated hour labels on pricing cards; some locales spell numbers out (e.g.
# Arabic), so prose cannot be templated.
#
# Code owners (single source of truth per fact):
#   price_per_minute_usd  -> backend/.env  PRICE_PER_MINUTE_USD
#   free_hours            -> backend/.env  INITIAL_FREE_SECONDS (/3600)
#   transcript_ttl_hours  -> backend/.env  TTL_DELIVERY (/3600)
#   upload_max_mb         -> backend/.env  MAX_UPLOAD_MB
#   language_count        -> mobile/lib/core/whisper_languages.dart
#   format_count          -> mobile/lib/config.dart  supportedExtensions (length)
#   max_duration_hours    -> mobile/lib/config.dart  maxDurationMs (/3600000)
#   packages              -> backend/shared/iap_catalog.py  _CATALOG

price_per_minute_usd: "0.0165"
free_hours: 2
language_count: 99
format_count: 40
audio_format_count: 22
video_format_count: 18
upload_max_mb: 96
max_duration_hours: 6
transcript_ttl_hours: 24

# IAP credit packages (owner: backend/shared/iap_catalog.py) — hours / price_usd
# 4-tier ladder (2026-07): discounts spread to be perceptible per step (~12/27/45%).
packages:
  - { id: safescribe_1h,   hours: 1,   price_usd: "0.99" }
  - { id: safescribe_8h,   hours: 8,   price_usd: "6.99" }
  - { id: safescribe_32h,  hours: 32,  price_usd: "22.99" }
  - { id: safescribe_128h, hours: 128, price_usd: "69.99" }
